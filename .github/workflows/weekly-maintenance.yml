name: TAMUSNI weekly maintenance

on:
  schedule:
    # Wake-up only: D1 decides which Sunday maintenance remains due.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: Envoyer le rapport PDF par e-mail
        required: true
        type: boolean
        default: true

concurrency:
  group: tamusni-weekly-maintenance
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAMUSNI_TEST_URL: https://tamusni.pages.dev
      EDITORIAL_HEALTH_URL: https://tamusni-editorial-automation.aetbconseil.workers.dev/health
      GITHUB_TOKEN: ${{ github.token }}
      TAMUSNI_USER_EMAIL: ${{ secrets.TAMUSNI_USER_EMAIL }}
      TAMUSNI_USER_PASSWORD: ${{ secrets.TAMUSNI_USER_PASSWORD }}
      TAMUSNI_CONTRIBUTOR_EMAIL: ${{ secrets.TAMUSNI_CONTRIBUTOR_EMAIL }}
      TAMUSNI_CONTRIBUTOR_PASSWORD: ${{ secrets.TAMUSNI_CONTRIBUTOR_PASSWORD }}
      TAMUSNI_ADMIN_EMAIL: ${{ secrets.TAMUSNI_ADMIN_EMAIL }}
      TAMUSNI_ADMIN_PASSWORD: ${{ secrets.TAMUSNI_ADMIN_PASSWORD }}
      MAINTENANCE_RUN_TOKEN: ${{ secrets.MAINTENANCE_RUN_TOKEN }}
      MAINTENANCE_REPORT_TOKEN: ${{ secrets.MAINTENANCE_REPORT_TOKEN }}
      MAINTENANCE_OUTPUT_DIR: artifacts/maintenance
    steps:
      - name: Claim due persistent maintenance job
        id: claim
        shell: bash
        run: |
          node - <<'NODE'
          const response=await fetch('https://tamusni.pages.dev/api/maintenance/run?mode=claim',{method:'POST',headers:{Authorization:`Bearer ${process.env.MAINTENANCE_RUN_TOKEN}`},signal:AbortSignal.timeout(30000)});
          const data=await response.json().catch(()=>({}));
          if(!response.ok||!data.ok)throw new Error(`Maintenance claim failed (${response.status})`);
          const job=data.job||null;
          const fs=await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`run=${Boolean(job)}\n`);
          if(job)fs.appendFileSync(process.env.GITHUB_OUTPUT,`job_id=${job.id}\nlock_token=${job.lockToken}\n`);
          console.log(JSON.stringify({localDate:data.localDate,claimed:Boolean(job),attempt:job?.attemptCount||0}));
          NODE

      - uses: actions/checkout@v7
        if: steps.claim.outputs.run == 'true'
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        if: steps.claim.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.claim.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.claim.outputs.run == 'true'
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Execute production maintenance audit
        id: audit
        if: steps.claim.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/maintenance/run.mjs

      - name: Install PDF renderer
        if: always() && steps.claim.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check reportlab pypdf

      - name: Generate PDF report
        id: pdf
        if: always() && steps.claim.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          DATE=$(node -e "const d=new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Casablanca',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());process.stdout.write(d)")
          FILE="artifacts/maintenance/TAMUSNI_Maintenance_${DATE}.pdf"
          python scripts/maintenance/generate_report.py artifacts/maintenance/maintenance.json "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Archive report and logs
        if: always() && steps.claim.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: tamusni-maintenance-${{ github.run_number }}
          path: artifacts/maintenance/
          retention-days: 90
          if-no-files-found: warn

      - name: Send PDF through TAMUSNI Brevo gateway
        id: send_report
        if: always() && steps.claim.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.send_email)
        continue-on-error: true
        run: node scripts/maintenance/send-report.mjs "${{ steps.pdf.outputs.file }}" artifacts/maintenance/maintenance.json

      - name: Enforce maintenance result
        id: enforce
        if: always() && steps.claim.outputs.run == 'true'
        continue-on-error: true
        run: node -e "const r=require('./artifacts/maintenance/maintenance.json');if(r.anomalies.some(x=>x.severity==='P0'||x.severity==='P1'))process.exit(1)"

      - name: Settle persistent maintenance job
        if: always() && steps.claim.outputs.run == 'true'
        env:
          JOB_ID: ${{ steps.claim.outputs.job_id }}
          LOCK_TOKEN: ${{ steps.claim.outputs.lock_token }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PDF_OUTCOME: ${{ steps.pdf.outcome }}
          REPORT_OUTCOME: ${{ steps.send_report.outcome }}
          ENFORCE_OUTCOME: ${{ steps.enforce.outcome }}
          REPORT_REQUIRED: ${{ github.event_name == 'schedule' || inputs.send_email }}
        run: |
          node - <<'NODE'
          const reportRequired=process.env.REPORT_REQUIRED==='true';
          const ok=process.env.AUDIT_OUTCOME==='success'&&process.env.PDF_OUTCOME==='success'&&(!reportRequired||process.env.REPORT_OUTCOME==='success')&&process.env.ENFORCE_OUTCOME==='success';
          const error=[['audit',process.env.AUDIT_OUTCOME],['pdf',process.env.PDF_OUTCOME],['report',process.env.REPORT_OUTCOME],['enforce',process.env.ENFORCE_OUTCOME]].filter(([,outcome])=>outcome&&outcome!=='success'&&outcome!=='skipped').map(([name,outcome])=>`${name}:${outcome}`).join(', ')||'Maintenance checks reported a blocking anomaly';
          const response=await fetch('https://tamusni.pages.dev/api/maintenance/run?mode=complete',{method:'POST',headers:{Authorization:`Bearer ${process.env.MAINTENANCE_RUN_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({jobId:process.env.JOB_ID,lockToken:process.env.LOCK_TOKEN,ok,result:{audit:process.env.AUDIT_OUTCOME,pdf:process.env.PDF_OUTCOME,report:process.env.REPORT_OUTCOME,enforce:process.env.ENFORCE_OUTCOME},error}),signal:AbortSignal.timeout(30000)});
          const data=await response.json().catch(()=>({}));
          if(!response.ok||!data.ok)throw new Error(`Maintenance settle failed (${response.status})`);
          console.log(JSON.stringify(data));
          NODE

      - name: Open incident on failure
        if: always() && steps.claim.outputs.run == 'true' && steps.enforce.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Maintenance TAMUSNI en échec — ${date}`,
              body: `La maintenance hebdomadaire a échoué ou a détecté une anomalie bloquante. Consultez l’exécution GitHub Actions et l’artefact PDF : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

      - name: Fail workflow when maintenance is incomplete
        if: always() && steps.claim.outputs.run == 'true' && (steps.audit.outcome != 'success' || steps.pdf.outcome != 'success' || steps.enforce.outcome != 'success' || ((github.event_name == 'schedule' || inputs.send_email) && steps.send_report.outcome != 'success'))
        run: exit 1
