name: TAMUSNI weekly newsletter

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Générer et contrôler sans envoyer
        required: true
        type: boolean
        default: true
      send_test_emails:
        description: Envoyer deux e-mails de test à aetbconseil@gmail.com
        required: true
        type: boolean
        default: false

concurrency:
  group: tamusni-weekly-newsletter
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate or send the weekly edition
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          SEND_TEST_EMAILS: ${{ inputs.send_test_emails }}
          NEWSLETTER_RUN_TOKEN: ${{ secrets.NEWSLETTER_RUN_TOKEN }}
        run: |
          node - <<'NODE'
          const manual=process.env.EVENT_NAME==='workflow_dispatch';
          const dryRun=manual&&process.env.MANUAL_DRY_RUN!=='false';
          const testEmails=manual&&process.env.SEND_TEST_EMAILS==='true';
          const suffix=testEmails?'?mode=email-test':manual?(dryRun?'?force=1&dryRun=1':'?force=1'):'?force=1';
          const response=await fetch(`https://tamusni.pages.dev/api/newsletter/run${suffix}`,{method:'POST',headers:{Authorization:`Bearer ${process.env.NEWSLETTER_RUN_TOKEN}`},signal:AbortSignal.timeout(120000)});
          const result=await response.json().catch(()=>({}));
          console.log(JSON.stringify({status:response.status,dryRun,testEmails,ok:result.ok,result:result.result||null,count:result.count||null,messageIds:result.messageIds||null}));
          if(!response.ok||!result.ok)process.exit(1);
          NODE
