name: TAMUSNI social distribution
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: tamusni-social-distribution
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process the Cloudflare social queue
        env:
          SOCIAL_RUN_TOKEN: ${{ secrets.SOCIAL_RUN_TOKEN }}
        run: |
          test -n "$SOCIAL_RUN_TOKEN"
          curl --fail-with-body --retry 2 --retry-all-errors --max-time 120 -X POST \
            -H "Authorization: Bearer $SOCIAL_RUN_TOKEN" \
            https://tamusni.pages.dev/api/social/run
