<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — TAMUSNI</title><link rel="stylesheet" href="/auth.css"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:35px 0}.stat{border:1px solid var(--line);padding:20px}.stat strong{display:block;font:600 36px "Playfair Display",serif}.stat span{font-size:12px;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}@media(max-width:380px){.stats{grid-template-columns:1fr}}</style></head><body><header class="top shell"><a class="brand" href="/">TAMUSNI</a><a class="back" href="/">Voir le site</a></header><main class="shell" style="padding:8vh 0"><p class="eyebrow">Administration sécurisée</p><h1>Tableau de bord.</h1><p class="intro" id="admin-message">Chargement des indicateurs…</p><section class="stats" id="stats"></section><button id="logout" style="padding:11px 16px">Se déconnecter</button></main><script>async function load(){var s=await fetch('/api/auth/session');if(!s.ok){location.href='/connexion/';return}var session=await s.json();if(session.user.role!=='ADMIN'){location.href='/compte/';return}var response=await fetch('/api/admin/stats');if(!response.ok){document.getElementById('admin-message').textContent='Indicateurs indisponibles.';return}var data=await response.json();document.getElementById('admin-message').textContent='Bonjour '+session.user.name+'. Les données ci-dessous proviennent directement de la base Cloudflare.';var labels={users:'Comptes utilisateurs',subscribers:'Abonnés à la revue',favorites:'Favoris enregistrés',live:'Informations en direct'};var box=document.getElementById('stats');Object.keys(labels).forEach(function(key){var card=document.createElement('article');card.className='stat';var number=document.createElement('strong');number.textContent=data[key];var label=document.createElement('span');label.textContent=labels[key];card.append(number,label);box.append(card)})}document.getElementById('logout').onclick=async function(){await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();</script></body></html>
