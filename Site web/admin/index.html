<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — TAMUSNI</title><link rel="stylesheet" href="/auth.css"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.stat{border:1px solid var(--line);padding:18px}.stat strong{display:block;font:600 32px "Playfair Display",serif}.admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0}.admin-tabs button{padding:9px 13px;border:1px solid var(--line);background:transparent;color:inherit}.admin-tabs button.is-active{background:var(--ink);color:var(--bg)}.admin-panel{display:none}.admin-panel.is-active{display:block}.editor{display:grid;grid-template-columns:1fr 1fr;gap:12px}.editor label{display:grid;gap:5px;font-size:12px}.editor input,.editor select,.editor textarea{padding:10px;background:var(--bg);color:inherit;border:1px solid var(--line);font:inherit}.editor textarea{min-height:100px}.editor .wide{grid-column:1/-1}.editor button{padding:12px;background:var(--ink);color:var(--bg);border:0}.admin-list{display:grid;gap:9px;margin:20px 0}.admin-row{display:grid;grid-template-columns:1fr auto;gap:15px;border:1px solid var(--line);padding:13px}.admin-row small{display:block;color:var(--muted)}.admin-row select,.admin-row button{padding:7px;background:transparent;color:inherit;border:1px solid var(--line)}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.editor{grid-template-columns:1fr}.editor .wide{grid-column:1}.admin-row{grid-template-columns:1fr}}</style></head><body><header class="top shell"><a class="brand" href="/">TAMUSNI</a><a class="back" href="/">Voir le site</a></header><main class="shell" style="padding:7vh 0"><p class="eyebrow">Administration sécurisée</p><h1>Tableau de bord.</h1><p class="intro" id="admin-message">Chargement…</p><section class="stats" id="stats"></section><nav class="admin-tabs"><button class="is-active" data-admin-tab="content">Contenus</button><button data-admin-tab="comments">Modération</button><button data-admin-tab="users">Utilisateurs</button><button data-admin-tab="audit">Journal</button></nav><section class="admin-panel is-active" data-admin-panel="content"><h2>Créer un contenu</h2><form id="content-form" class="editor"><label>Titre<input name="title" required minlength="5"></label><label>URL propre<input name="slug" required pattern="[a-z0-9-]+"></label><label>Type<select name="type"><option value="article">Article</option><option value="video">Vidéo</option><option value="podcast">Podcast</option></select></label><label>Statut<select name="status"><option value="draft">Brouillon</option><option value="review">À valider</option><option value="published">Publié</option><option value="scheduled">Programmé</option></select></label><label>Catégorie<input name="category" required></label><label>Auteur<input name="authorName" value="Rédaction TAMUSNI"></label><label class="wide">Introduction<textarea name="excerpt"></textarea></label><label class="wide">Résumé<textarea name="summary"></textarea></label><label class="wide">Corps de l’article<textarea name="body" required></textarea></label><label>URL du média HTTPS<input name="mediaUrl" type="url"></label><label>URL des sous-titres HTTPS<input name="subtitlesUrl" type="url"></label><label class="wide">Transcription<textarea name="transcript"></textarea></label><label>Vérification<select name="factCheckStatus"><option value="verified">Vérifié</option><option value="context">Contexte nécessaire</option><option value="correction">Correction</option><option value="opinion">Opinion</option></select></label><label>Tags séparés par des virgules<input name="tags"></label><label>Nom de la source<input name="sourceLabel"></label><label>URL de la source HTTPS<input name="sourceUrl" type="url"></label><label>Éditeur de la source<input name="sourcePublisher"></label><label><input type="checkbox" name="sponsored"> Contenu sponsorisé</label><label>Nom du sponsor<input name="sponsorName"></label><button class="wide">Enregistrer</button></form><p id="editor-message" role="status"></p><h2>Contenus existants</h2><div id="content-list" class="admin-list"></div></section><section class="admin-panel" data-admin-panel="comments"><h2>Commentaires à modérer</h2><div id="comment-list" class="admin-list"></div></section><section class="admin-panel" data-admin-panel="users"><h2>Comptes et rôles</h2><div id="user-list" class="admin-list"></div></section><section class="admin-panel" data-admin-panel="audit"><h2>Journal administratif</h2><p>Chaque création, publication, changement de rôle et décision de modération est enregistré dans la base.</p></section><button id="logout" style="padding:11px 16px">Se déconnecter</button></main><script src="/admin-client.js" defer></script></body></html>
