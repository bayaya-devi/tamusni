<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon compte — TAMUSNI</title><link rel="stylesheet" href="/auth.css"></head><body><header class="top shell"><a class="brand" href="/">TAMUSNI</a><a class="back" href="/">Retour au site</a></header><main class="shell" style="padding:8vh 0"><p class="eyebrow">Mon espace</p><h1 id="welcome">Votre bibliothèque.</h1><p class="intro">Retrouvez ici les contenus enregistrés pour les lire ou les regarder plus tard.</p><section class="favorites" id="favorites"><p class="empty">Chargement…</p></section><button id="logout" style="padding:11px 16px">Se déconnecter</button></main><script>async function load(){var s=await fetch('/api/auth/session');if(!s.ok){location.href='/connexion/';return}var session=await s.json();document.getElementById('welcome').textContent='Bonjour, '+session.user.name+'.';var r=await fetch('/api/favorites');var data=await r.json();var box=document.getElementById('favorites');box.innerHTML='';if(!data.items||!data.items.length){box.innerHTML='<p class="empty">Aucun favori pour le moment.</p>';return}data.items.forEach(function(item){var row=document.createElement('article');row.className='favorite';var link=document.createElement('a');link.href=item.url;link.textContent=item.title;var button=document.createElement('button');button.textContent='Retirer';button.onclick=async function(){await fetch('/api/favorites',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({itemId:item.item_id})});row.remove()};row.append(link,button);box.append(row)})}document.getElementById('logout').onclick=async function(){await fetch('/api/auth/logout',{method:'POST'});location.href='/'};load();</script></body></html>
