<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nouveau mot de passe — TAMUSNI</title><link rel="stylesheet" href="/auth.css"></head><body><header class="top shell"><a class="brand" href="/">TAMUSNI</a></header><main class="auth shell"><div><p class="eyebrow">Compte</p><h1>Choisissez un nouveau mot de passe.</h1></div><section class="panel"><form id="reset-form"><label>Nouveau mot de passe<input name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label><button type="submit">Enregistrer</button><p class="message" id="form-message" role="status"></p></form></section></main><script>var form=document.getElementById('reset-form'),message=document.getElementById('form-message'),token=new URLSearchParams(location.search).get('token');form.onsubmit=async function(event){event.preventDefault();var response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,password:new FormData(form).get('password')})});var data=await response.json();message.textContent=data.error||'Mot de passe modifié. Redirection…';if(response.ok)setTimeout(function(){location.href=data.redirect},700)}</script></body></html>
