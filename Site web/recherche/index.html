<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recherche — TAMUSNI</title><link rel="stylesheet" href="/auth.css"><style>.search-page{padding:6vh 0}.search-page h1{margin-bottom:10px}.filters{display:grid;grid-template-columns:minmax(0,2fr) 1fr 1fr auto;gap:10px;margin:24px 0}.filters input,.filters select{padding:11px;border:1px solid var(--line);background:var(--bg);color:inherit;font:inherit}.filters button{width:44px;padding:11px;background:var(--ink);color:var(--bg);border:0;font-size:20px;cursor:pointer}.results{display:grid;gap:12px}.result-card{display:grid;gap:5px;border-top:1px solid var(--line);padding:18px 0}.result-card a{font:600 24px "Playfair Display",serif;color:inherit;text-decoration:none}.result-card small,.result-card p{color:var(--muted)}@media(max-width:760px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.filters button{justify-self:end}}</style></head><body><main class="shell search-page"><p class="eyebrow">Recherche</p><h1>Trouvez un article.</h1><p class="intro">Les fautes d’orthographe courantes sont corrigées automatiquement.</p><form id="search-form" class="filters"><input name="q" type="search" placeholder="Sujet, titre ou mot-clé" aria-label="Recherche"><select name="category"><option value="">Toutes les catégories</option><option>Intelligence</option><option>Innovation</option><option>Technologies</option><option>Robotique</option><option>Cybersécurité</option><option>Futur</option><option>Espace</option><option>Sciences</option></select><select name="sort"><option value="recent">Les plus récents</option><option value="popular">Les plus lus</option><option value="oldest">Les plus anciens</option></select><button aria-label="Rechercher" title="Rechercher">⌕</button></form><p id="search-status" role="status"></p><section id="results" class="results"></section></main><script src="/search-client.js" defer></script></body></html>
