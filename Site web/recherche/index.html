<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recherche — TAMUSNI</title><link rel="stylesheet" href="/auth.css"><style>.search-page{padding:7vh 0}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin:25px 0}.filters input,.filters select{padding:11px;border:1px solid var(--line);background:var(--bg);color:inherit;font:inherit}.filters button{padding:11px;background:var(--ink);color:var(--bg);border:0}.results{display:grid;gap:12px}.result-card{display:grid;gap:5px;border-top:1px solid var(--line);padding:18px 0}.result-card a{font:600 24px "Playfair Display",serif;color:inherit;text-decoration:none}.result-card small,.result-card p{color:var(--muted)}.voice{background:transparent!important;color:inherit!important;border:1px solid var(--line)!important}@media(max-width:760px){.filters{grid-template-columns:1fr}}</style></head><body><header class="top shell"><a class="brand" href="/">TAMUSNI</a><a class="back" href="/">Accueil</a></header><main class="shell search-page"><p class="eyebrow">Explorer TAMUSNI</p><h1>Recherche globale.</h1><form id="search-form" class="filters"><input name="q" type="search" placeholder="Sujet, titre ou mot-clé"><select name="category"><option value="">Toutes les catégories</option><option>Intelligence</option><option>Innovation</option><option>Technologies</option><option>Robotique</option><option>Cybersécurité</option><option>Futur</option><option>Espace</option><option>Sciences</option></select><select name="type"><option value="">Tous les formats</option><option value="article">Articles</option><option value="video">Vidéos</option><option value="podcast">Podcasts</option></select><select name="sort"><option value="recent">Plus récents</option><option value="popular">Plus lus</option></select><input name="author" placeholder="Auteur"><input name="from" type="date" aria-label="Date de début"><input name="to" type="date" aria-label="Date de fin"><button>Rechercher</button><button type="button" id="voice-search" class="voice">Recherche vocale</button></form><p id="search-status" role="status"></p><section id="results" class="results"></section></main><script src="/search-client.js" defer></script></body></html>
