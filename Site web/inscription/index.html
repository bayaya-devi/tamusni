<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscription — TAMUSNI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/auth.css"></head><body><header class="top shell"><a class="brand" href="/">TAMUSNI</a><a class="back" href="/">Retour au site</a></header><main class="auth shell"><div><p class="eyebrow">Compte gratuit</p><h1>Créez votre bibliothèque TAMUSNI.</h1><p class="intro">Enregistrez vos lectures, favoris et préférences.</p></div><section class="panel"><form data-auth-form data-endpoint="/api/auth/register"><label>Prénom<input name="firstName" autocomplete="given-name" minlength="2" maxlength="40" required></label><label>Nom<input name="lastName" autocomplete="family-name" minlength="2" maxlength="40" required></label><label>Adresse e-mail<input name="email" type="email" autocomplete="email" required></label><label class="password-field">Mot de passe<input name="password" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></label><button type="submit">Créer mon compte</button><p class="message" id="form-message" role="status"></p></form><div class="links"><span>6 caractères minimum</span><a href="/connexion/">J’ai déjà un compte</a></div></section></main><script src="/auth-client.js?v=mfa-2" defer></script></body></html>
